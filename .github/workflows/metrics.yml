name: Metrics

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/metrics.yml"
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🦑 General profile
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: general.svg
          token: ${{ secrets.TOKEN }}
          user: danterkive
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: 📅 Contributions calendar
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: contributions.svg
          token: ${{ secrets.TOKEN }}
          user: danterkive
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: 🏆 Achievements
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: achievements.svg
          token: ${{ secrets.TOKEN }}
          user: danterkive
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X

      - name: 🏷️ Starred topics
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: topics.svg
          token: NOT_NEEDED
          user: danterkive
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 18

      - name: ⭐ Star lists and languages
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: starlists.svg
          token: NOT_NEEDED
          user: danterkive
          base: ""
          plugin_starlists: yes
          plugin_starlists_languages: yes
          plugin_starlists_limit_languages: 8
          plugin_starlists_limit_repositories: 0

      - name: 🌸 AniList favorites and characters
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: medias.svg
          token: NOT_NEEDED
          user: danterkive
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: danterkive
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit: 3
          plugin_anilist_limit_characters: 22
          plugin_anilist_shuffle: no

      - name: 🎧 Recently played on Spotify
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: music-recent.svg
          token: NOT_NEEDED
          base: ""
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: recent
          plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
          plugin_music_limit: 6
          plugin_music_played_at: yes

      - name: 🎮 Recently played on Steam
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: steam-recent.svg
          token: NOT_NEEDED
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: ${{ secrets.STEAM_USER_ID }}
          plugin_steam_sections: recently-played
          plugin_steam_recent_games_limit: 4
          plugin_steam_achievements_limit: 5
          plugin_steam_playtime_threshold: 0

      # Recent posts can only be enabled after you have a dev.to or Hashnode account.
      # - name: ✒️ Recent posts
      #   uses: lowlighter/metrics@latest
      #   with:
      #     filename: posts.svg
      #     token: NOT_NEEDED
      #     base: ""
      #     plugin_posts: yes
      #     plugin_posts_source: dev.to
      #     plugin_posts_user: danterkive
      #     plugin_posts_limit: 2
      #     plugin_posts_descriptions: yes
      #     plugin_posts_covers: yes
