name: Metrics

on:
  schedule: [{ cron: "0 16 * * *" }]
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🦑 General
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: general.svg
          token: ${{ secrets.TOKEN }}
          user: danterkive
          base: header
          base_indepth: yes
          config_timezone: America/Sao_Paulo
          config_order: base.header, isocalendar, languages, habits
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: 🦑 Medias
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: medias.svg
          token: ${{ secrets.TOKEN }}
          user: danterkive
          base: ""
          config_order: anilist, music
          plugin_anilist: yes
          plugin_anilist_user: danterkive
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit: 3
          plugin_anilist_limit_characters: 15
          plugin_anilist_shuffle: no
          plugin_music: yes
          plugin_music_playlist: ${{ secrets.PLAYLIST }}
          plugin_music_limit: 9
