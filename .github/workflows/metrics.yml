name: Metrics

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📊 GitHub profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN }}
          user: danterkive
          filename: github-metrics.svg
          template: terminal
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: 📅 Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN }}
          user: danterkive
          filename: metrics.plugin.isocalendar.svg
          base: ""
          template: terminal
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: 🎧 Spotify suggestions
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: danterkive
          filename: metrics.plugin.music.svg
          base: ""
          template: terminal
          plugin_music: yes
          plugin_music_playlist: ${{ secrets.PLAYLIST }}
          plugin_music_limit: 6

      - name: 🌸 AniList favorites and characters
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: danterkive
          filename: metrics.plugin.anilist.svg
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: danterkive
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit: 3
          plugin_anilist_limit_characters: 15
          plugin_anilist_shuffle: no
